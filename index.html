<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Simulador de Vuelo y Conducción 3D - Multiplataforma</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6eb7ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #6eb7ff; font-family: sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
    .interactive { pointer-events: auto; }
    #top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    #hud { color: #00ffcc; font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 6px; border: 1px solid #00ffcc; }
    .btn-group { display: flex; gap: 8px; }
    .btn { background: rgba(255,255,255,0.2); border: 2px solid #fff; color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 12px; text-transform: uppercase; backdrop-filter: blur(4px); cursor: pointer; }
    .btn:active { background: rgba(255,255,255,0.5); }
    #action-btn { background: rgba(0, 255, 204, 0.3); border-color: #00ffcc; color: #00ffcc; }
    #controls-container { display: flex; width: 100%; height: calc(100% - 60px); justify-content: space-between; align-items: flex-end; padding-bottom: 10px; transition: opacity 0.3s; }
    #left-zone, #right-zone { width: 45%; height: 100%; display: flex; align-items: flex-end; }
    #left-zone { justify-content: flex-start; }
    #right-zone { justify-content: flex-end; }
    #joystick-base { width: 130px; height: 130px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    #joystick-stick { width: 50px; height: 50px; background: #00ffcc; border-radius: 50%; position: absolute; box-shadow: 0 0 10px #00ffcc; }
    #throttle-container { width: 70px; height: 220px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); border-radius: 12px; position: relative; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 10px 0; backdrop-filter: blur(4px); }
    #throttle-track { position: absolute; top: 20px; bottom: 20px; width: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; }
    #throttle-handle { width: 50px; height: 30px; background: #ff3366; border-radius: 6px; position: absolute; bottom: 20px; left: 10px; box-shadow: 0 0 8px #ff3366; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 10px; transition: background 0.3s, box-shadow 0.3s, color 0.3s; }
    .gear-label { font-size: 9px; color: #fff; z-index: 2; font-family: monospace; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui">
    <div id="top-bar">
      <div id="hud">
        MODE: <span id="hud-mode">AVION</span> | ALT: <span id="hud-alt">0</span>m | VEL: <span id="hud-spd">0</span>km/h | GEAR: <span id="hud-gear">N</span>
      </div>
      <div class="btn-group">
        <button id="action-btn" class="btn interactive">ENTRAR / SALIR</button>
        <button id="toggle-ui-btn" class="btn interactive">Ocultar UI</button>
        <button id="swap-btn" class="btn interactive">Invertir</button>
      </div>
    </div>

    <div id="controls-container">
      <div id="left-zone" class="interactive">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>
      <div id="right-zone" class="interactive">
        <div id="throttle-container">
          <div id="throttle-track"></div>
          <span class="gear-label">7</span>
          <span class="gear-label">6</span>
          <span class="gear-label">5</span>
          <span class="gear-label">4</span>
          <span class="gear-label">3</span>
          <span class="gear-label">2</span>
          <span class="gear-label">1</span>
          <span class="gear-label">N</span>
          <span class="gear-label">R</span>
          <div id="throttle-handle">N</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {
          console.log("Service Worker no registrado");
        });
      });
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const skyColor = new THREE.Color(0x6eb7ff);
    scene.background = skyColor;
    
    const FOG_NEAR = 10000;
    const FOG_FAR = 45000;
    scene.fog = new THREE.FogExp2(skyColor, 0.000025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);

    const renderer = new THREE.WebGLRenderer({ 
      antialias: true, 
      powerPreference: "high-performance",
      logarithmicDepthBuffer: true 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = true;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 2.0);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 4096;
    dirLight.shadow.mapSize.height = 4096;
    
    const shadowDistance = 25000; 
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 80000;
    dirLight.shadow.camera.left = -shadowDistance;
    dirLight.shadow.camera.right = shadowDistance;
    dirLight.shadow.camera.top = shadowDistance;
    dirLight.shadow.camera.bottom = -shadowDistance;
    dirLight.shadow.bias = -0.0001;
    dirLight.shadow.normalBias = 0.02;
    scene.add(dirLight);

    const sunGroup = new THREE.Group();
    const sunGeo = new THREE.SphereGeometry(1200, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xfffbe8 });
    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
    const glowGeo = new THREE.SphereGeometry(2200, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xffddaa, transparent: true, opacity: 0.35, side: THREE.BackSide });
    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
    sunGroup.add(sunMesh); sunGroup.add(glowMesh);
    scene.add(sunGroup);

    // ==========================================
    // SISTEMA DE AGUA POR GPU 
    // ==========================================
    const WATER_LEVEL = 70;

    const localWaterMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x005577, emissive: 0x001122, metalness: 0.7, roughness: 0.08, transmission: 0.4, ior: 1.333, thickness: 5.0, transparent: true, opacity: 1.0, side: THREE.DoubleSide
    });

    localWaterMaterial.onBeforeCompile = function (shader) {
      shader.uniforms.uTime = { value: 0 };
      localWaterMaterial.userData.shader = shader;
      shader.vertexShader = `
        uniform float uTime;
        varying float vDist;
        ${shader.vertexShader}
      `.replace(
        `#include <beginnormal_vertex>`,
        `
        float dist = length(position.xz);
        vDist = dist;
        float waveBlend = 1.0 - smoothstep(6250.0, 9500.0, dist);
        vec4 tempWorldPos = modelMatrix * vec4( position, 1.0 );
        float wx = tempWorldPos.x;
        float wz = tempWorldPos.z;
        float arg1 = (wx * 0.4 + wz * 0.9) * 0.004 + uTime * 0.8;
        float d1x = cos(arg1) * 8.0 * (0.4 * 0.004);
        float d1z = cos(arg1) * 8.0 * (0.9 * 0.004);
        float arg2 = (wx * -0.7 + wz * 0.7) * 0.012 + uTime * 1.3;
        float d2x = cos(arg2) * 4.5 * (-0.7 * 0.012);
        float d2z = cos(arg2) * 4.5 * (0.7 * 0.012);
        float arg3 = (wx * 0.8 + wz * -0.6) * 0.025 + uTime * 1.8;
        float d3x = cos(arg3) * 2.5 * (0.8 * 0.025);
        float d3z = cos(arg3) * 2.5 * (-0.6 * 0.025);
        float arg4 = (wx * -0.5 + wz * -0.8) * 0.050 + uTime * 2.5;
        float d4x = cos(arg4) * 1.0 * (-0.5 * 0.050);
        float d4z = cos(arg4) * 1.0 * (-0.8 * 0.050);
        float arg5 = (wx * 1.2 + wz * 1.5) * 0.15 + uTime * 3.2;
        float d5x = cos(arg5) * 0.4 * (1.2 * 0.15);
        float d5z = cos(arg5) * 0.4 * (1.5 * 0.15);
        float dWdx = (d1x + d2x + d3x + d4x + d5x) * waveBlend;
        float dWdz = (d1z + d2z + d3z + d4z + d5z) * waveBlend;
        vec3 objectNormal = normalize(vec3(-dWdx, 1.0, -dWdz));
        `
      ).replace(
        `#include <begin_vertex>`,
        `
        vec3 transformed = vec3( position );
        float h1 = sin((wx * 0.4 + wz * 0.9) * 0.004 + uTime * 0.8) * 8.0;
        float h2 = sin((wx * -0.7 + wz * 0.7) * 0.012 + uTime * 1.3) * 4.5;
        float h3 = sin((wx * 0.8 + wz * -0.6) * 0.025 + uTime * 1.8) * 2.5;
        float h4 = sin((wx * -0.5 + wz * -0.8) * 0.050 + uTime * 2.5) * 1.0;
        transformed.y += (h1 + h2 + h3 + h4) * waveBlend; 
        `
      );
      shader.fragmentShader = `
        varying float vDist;
        ${shader.fragmentShader}
      `.replace(
        `#include <alphamap_fragment>`,
        `
        #include <alphamap_fragment>
        float alphaFade = 1.0 - smoothstep(6250.0, 9500.0, vDist);
        diffuseColor.a *= alphaFade;
        `
      );
    };

    const distantWaterMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x005577, emissive: 0x001122, metalness: 0.7, roughness: 0.15, side: THREE.DoubleSide
    });

    distantWaterMaterial.onBeforeCompile = function (shader) {
      shader.uniforms.uTime = { value: 0 };
      distantWaterMaterial.userData.shader = shader;
      shader.vertexShader = `
        varying vec2 vWorldXZ;
        ${shader.vertexShader}
      `.replace(
        `#include <begin_vertex>`,
        `
        #include <begin_vertex>
        vec4 wPos = modelMatrix * vec4(position, 1.0);
        vWorldXZ = wPos.xz;
        `
      );
      shader.fragmentShader = `
        uniform float uTime;
        varying vec2 vWorldXZ;
        ${shader.fragmentShader}
      `.replace(
        `#include <normal_fragment_begin>`,
        `
        #include <normal_fragment_begin>
        vec2 s1 = vWorldXZ * 0.001; vec2 s2 = vWorldXZ * 0.0025; float t = uTime * 1.5;
        float dx = sin(s1.x + t) * 0.15 + sin(s2.y - t * 0.8) * 0.1;
        float dz = cos(s1.y + t) * 0.15 + cos(s2.x - t * 0.9) * 0.1;
        vec3 waveNorm = normalize(vec3(-dx, 1.0, -dz));
        normal = normalize(mat3(viewMatrix) * waveNorm);
        #ifdef DOUBLE_SIDED
          normal = normal * faceDirection;
        #endif
        `
      );
    };

    const localWaterGeo = new THREE.PlaneGeometry(20000, 20000, 256, 256); 
    localWaterGeo.rotateX(-Math.PI / 2);
    const localWater = new THREE.Mesh(localWaterGeo, localWaterMaterial);
    localWater.receiveShadow = true;

    const distantWaterGeo = new THREE.PlaneGeometry(200000, 200000, 2, 2); 
    distantWaterGeo.rotateX(-Math.PI / 2);
    const distantWater = new THREE.Mesh(distantWaterGeo, distantWaterMaterial);
    distantWater.receiveShadow = true; distantWater.position.y = -0.5;

    const waterGroup = new THREE.Group();
    waterGroup.add(distantWater); waterGroup.add(localWater);
    waterGroup.position.y = WATER_LEVEL;
    scene.add(waterGroup);

    // ==========================================
    // GENERACIÓN DE TERRENO Y FÍSICAS
    // ==========================================
    const SEED_X = Math.random() * 100000;
    const SEED_Z = Math.random() * 100000;

    const _tempNormal = new THREE.Vector3();
    const _baseLookAhead = new THREE.Vector3(0, 1, 5);

    function pseudoNoise(x, z) { 
      const sx = x + SEED_X; const sz = z + SEED_Z;
      const baseLand = -10; 
      const warpX = Math.sin(sx * 0.00018 + Math.cos(sz * 0.00012)) * 1800;
      const warpZ = Math.cos(sz * 0.00018 + Math.sin(sx * 0.00012)) * 1800;
      const wx = sx + warpX; const wz = sz + warpZ;

      const densityNoise = (Math.sin(wx * 0.00008) + Math.cos(wz * 0.00008)) * 0.5;
      let mountainPresence = Math.min(1.0, Math.max(0, (densityNoise - 0.05) * 2.2));

      const nBroad = Math.sin(wx * 0.00035) * Math.cos(wz * 0.00035);
      const nLow = Math.sin(wx * 0.0005) * Math.cos(wz * 0.0004); 
      const nMid = Math.sin(wx * 0.0022) * Math.cos(wz * 0.0022);
      const nDetail = Math.sin(wx * 0.0055) * Math.cos(wz * 0.0055);

      const typeNoise = Math.sin(wx * 0.00015) + Math.cos(wz * 0.00015);
      let normVal = Math.min(1, Math.max(0, nLow + 0.2) / 1.2);
      let mountainSpread = 0;

      if (typeNoise > 0.6) { mountainSpread = Math.pow(normVal, 0.65); }
      else if (typeNoise < -0.6) { mountainSpread = Math.pow(normVal, 1.1); }
      else if (typeNoise > 0.0) {
        let subPeak = Math.sin(wx * 0.0012) * Math.cos(wz * 0.0012) * 0.25;
        mountainSpread = Math.min(1.0, Math.max(0, Math.pow(normVal, 0.75) + subPeak));
      } else { mountainSpread = Math.pow(normVal, 0.85); }

      mountainSpread *= mountainPresence;
      const plainFactor = Math.max(0.05, Math.pow(Math.max(0, nBroad), 2));

      return baseLand + (mountainSpread * 15000) + (nMid * 400 * plainFactor) + (nLow * 600) + (nDetail * 30 * plainFactor);
    }

    function getNormalAt(x, z) {
      const delta = 1.0;
      const hL = pseudoNoise(x - delta, z); const hR = pseudoNoise(x + delta, z);
      const hD = pseudoNoise(x, z - delta); const hU = pseudoNoise(x, z + delta);
      _tempNormal.set(hL - hR, 2.0 * delta, hD - hU); return _tempNormal.normalize();
    }

    function getWaterWaveHeight(x, z, t) {
      const h1 = Math.sin((x * 0.4 + z * 0.9) * 0.004 + t * 0.8) * 8.0;
      const h2 = Math.sin((x * -0.7 + z * 0.7) * 0.012 + t * 1.3) * 4.5;
      const h3 = Math.sin((x * 0.8 + z * -0.6) * 0.025 + t * 1.8) * 2.5;
      const h4 = Math.sin((x * -0.5 + z * -0.8) * 0.050 + t * 2.5) * 1.0;
      return WATER_LEVEL + h1 + h2 + h3 + h4;
    }

    const SHARED_GEOS = {
      tree: new THREE.ConeGeometry(5, 18, 4),
      rock: new THREE.DodecahedronGeometry(8),
      snow: new THREE.ConeGeometry(25, 20, 4),
      runway: new THREE.PlaneGeometry(60, 500),
      tower: new THREE.CylinderGeometry(4, 6, 50, 8),
      cloud: new THREE.DodecahedronGeometry(1800),
      houseBase: new THREE.BoxGeometry(20, 60, 20),       
      houseRoof: new THREE.ConeGeometry(17, 10, 4),       
      midBuilding: new THREE.BoxGeometry(30, 1, 30),      
      skyscraper: new THREE.BoxGeometry(45, 1, 45),       
      antenna: new THREE.CylinderGeometry(1.5, 1.5, 60, 4),
      planeBody: new THREE.ConeGeometry(1.2, 8, 8),
      planeWing: new THREE.BoxGeometry(10, 0.1, 2),
      planeTail: new THREE.BoxGeometry(0.1, 1.8, 1.2),
      planeProp: new THREE.BoxGeometry(2.4, 0.2, 0.05),
      carBody: new THREE.BoxGeometry(3.2, 1.2, 5.5),
      carCabin: new THREE.BoxGeometry(2.8, 1.1, 3.0),
      carWheel: new THREE.CylinderGeometry(0.55, 0.55, 0.4, 16)
    };
    SHARED_GEOS.runway.rotateX(-Math.PI / 2);
    SHARED_GEOS.houseRoof.rotateY(Math.PI / 4); 
    SHARED_GEOS.planeBody.rotateX(Math.PI / 2);
    SHARED_GEOS.carWheel.rotateZ(Math.PI / 2);

    const invisibleMat = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
    const sharedDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });

    const SHARED_MATS = {
      terrain: new THREE.MeshStandardMaterial({ color: 0x2e6f40, roughness: 0.85, metalness: 0.1, flatShading: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }),
      tree: new THREE.MeshStandardMaterial({ color: 0x184725 }),
      rock: new THREE.MeshStandardMaterial({ color: 0x777777, flatShading: true }),
      snow: new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true }),
      runway: new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }),
      tower: new THREE.MeshStandardMaterial({ color: 0xcccccc }),
      cloud: new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, flatShading: true }),
      building: new THREE.MeshStandardMaterial({ color: 0x8899aa, roughness: 0.4 }),
      roof: new THREE.MeshStandardMaterial({ color: 0x8b2b2b, roughness: 0.9 }),
      road: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }),
      planeWingMat: new THREE.MeshStandardMaterial({ color: 0xeeeeee }),
      planePropMat: new THREE.MeshStandardMaterial({ color: 0x111111 }),
      carBodyInst: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }),
      carCabinInst: new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.1 }),
      carWheelInst: new THREE.MeshStandardMaterial({ color: 0x111111 })
    };

    // ==========================================
    // CREADOR DE COCHES, AVIONES Y PERSONAJE
    // ==========================================
    const worldCars = [];
    const worldPlanes = [];
    const carColors = [0xc0392b, 0x2980b9, 0x27ae60, 0xf39c12, 0x8e44ad, 0x2c3e50, 0xecf0f1];

    function createCarMesh() {
      const carGroup = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(3.2, 1.2, 5.5);
      const randomColor = carColors[Math.floor(Math.random() * carColors.length)];
      const bodyMat = new THREE.MeshStandardMaterial({ color: randomColor, roughness: 0.3 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.9;
      body.castShadow = true; body.receiveShadow = true; carGroup.add(body);

      const cabinGeo = new THREE.BoxGeometry(2.8, 1.1, 3.0);
      const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.1 });
      const cabin = new THREE.Mesh(cabinGeo, cabinMat);
      cabin.position.set(0, 1.9, -0.3); cabin.castShadow = true; carGroup.add(cabin);

      const wheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.4, 16); wheelGeo.rotateZ(Math.PI / 2);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
      const wheelPositions = [[-1.6, 0.55, 1.8], [1.6, 0.55, 1.8], [-1.6, 0.55, -1.8], [1.6, 0.55, -1.8]];
      wheelPositions.forEach(p => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.position.set(...p); wheel.castShadow = true; carGroup.add(wheel);
      });
      return carGroup;
    }

    function spawnCar(x, z, chunkKey = null, fixedY = null) {
      const carGroup = createCarMesh();
      const groundY = fixedY !== null ? fixedY : pseudoNoise(x, z);
      carGroup.position.set(x, groundY, z);
      
      const normal = getNormalAt(x, z);
      const qAlign = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
      carGroup.quaternion.copy(qAlign);
      
      scene.add(carGroup);
      const carObj = { group: carGroup, speed: 0, steering: 0, chunkKey: chunkKey, yaw: 0, isParkedInstanced: false };
      worldCars.push(carObj);
      return carObj;
    }

    // CREADOR DE AVIONES APARCADOS
    const planeColors = [0xd9381e, 0x2980b9, 0x27ae60, 0xf39c12, 0x8e44ad, 0xeeeeee, 0x333333];
    function createStaticPlaneMesh() {
      const pGroup = new THREE.Group();
      const color = planeColors[Math.floor(Math.random() * planeColors.length)];
      const bMat = new THREE.MeshStandardMaterial({ color: color });
      
      const body = new THREE.Mesh(SHARED_GEOS.planeBody, bMat);
      body.castShadow = true; body.receiveShadow = true; pGroup.add(body);
      
      const wings = new THREE.Mesh(SHARED_GEOS.planeWing, SHARED_MATS.planeWingMat);
      wings.position.set(0, 0, 0.5); wings.castShadow = true; wings.receiveShadow = true; pGroup.add(wings);
      
      const tail = new THREE.Mesh(SHARED_GEOS.planeTail, SHARED_MATS.planeWingMat);
      tail.position.set(0, 1, -3.2); tail.castShadow = true; tail.receiveShadow = true; pGroup.add(tail);
      
      const prop = new THREE.Mesh(SHARED_GEOS.planeProp, SHARED_MATS.planePropMat);
      prop.position.set(0, 0, 4.1); prop.castShadow = true; prop.receiveShadow = true; pGroup.add(prop);
      
      return pGroup;
    }

    // PERSONAJE A PIE
    const playerGroup = new THREE.Group();
    const pBodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.5, 8);
    const pMat = new THREE.MeshStandardMaterial({ color: 0x00aaff });
    const pBody = new THREE.Mesh(pBodyGeo, pMat); pBody.position.y = 0.75; pBody.castShadow = true; playerGroup.add(pBody);
    const pHeadGeo = new THREE.SphereGeometry(0.35, 8, 8);
    const pHeadMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
    const pHead = new THREE.Mesh(pHeadGeo, pHeadMat); pHead.position.y = 1.7; pHead.castShadow = true; playerGroup.add(pHead);
    playerGroup.visible = false; scene.add(playerGroup);

    // AVION DEL JUGADOR
    const planeGroup = new THREE.Group();
    const planeBodyMat = new THREE.MeshStandardMaterial({ color: 0xd9381e });
    const playerPlaneBody = new THREE.Mesh(SHARED_GEOS.planeBody, planeBodyMat); playerPlaneBody.castShadow = true; playerPlaneBody.receiveShadow = true; planeGroup.add(playerPlaneBody);
    const wings = new THREE.Mesh(SHARED_GEOS.planeWing, SHARED_MATS.planeWingMat); wings.position.set(0, 0, 0.5); wings.castShadow = true; wings.receiveShadow = true; planeGroup.add(wings);
    const tail = new THREE.Mesh(SHARED_GEOS.planeTail, SHARED_MATS.planeWingMat); tail.position.set(0, 1, -3.2); tail.castShadow = true; tail.receiveShadow = true; planeGroup.add(tail);
    const propeller = new THREE.Mesh(SHARED_GEOS.planeProp, SHARED_MATS.planePropMat); propeller.position.set(0, 0, 4.1); propeller.castShadow = true; propeller.receiveShadow = true; planeGroup.add(propeller);
    scene.add(planeGroup);

    // ESTRUCTURA DE SEGUIMIENTO DE AVIONES FLYABLE
    const initialPlaneObj = { group: planeGroup, prop: propeller, chunkKey: null };
    worldPlanes.push(initialPlaneObj);
    let activePlane = initialPlaneObj;

    const CHUNK_SIZE = 1200;
    const TERRAIN_SEGMENTS = 16;
    const RENDER_DISTANCE = 24; 
    const CLOUD_RENDER_DISTANCE = 36;
    const chunks = new Map();
    const activeCloudPositions = [];
    const activeAirports = [];

    const dummyMatrix = new THREE.Matrix4();
    const playerFrustum = new THREE.Frustum();
    const sunFrustum = new THREE.Frustum();
    const cameraMatrix = new THREE.Matrix4();
    const sunMatrix = new THREE.Matrix4();

    function getDeterministicRandom(x, z) {
      const dot = (x + SEED_X) * 12.9898 + (z + SEED_Z) * 78.233;
      const sinVal = Math.sin(dot) * 43758.5453123;
      return sinVal - Math.floor(sinVal);
    }
    
    function getSurfaceHeight(x, z) {
      const h = pseudoNoise(x, z);
      const pX = Math.floor(x / CHUNK_SIZE);
      const pZ = Math.floor(z / CHUNK_SIZE);
      const chunk = chunks.get(`${pX},${pZ}`);
      if (chunk && chunk.userData && chunk.userData.isCity) {
        return h + 1.0; 
      }
      return h;
    }

    function putCarUnderPlayer(targetPlayer, carTarget) {
      if (carTarget && targetPlayer) {
        if (carTarget.isParkedInstanced && !carTarget.group) {
          carTarget.group = createCarMesh();
          scene.add(carTarget.group);
          carTarget.isParkedInstanced = false;
        }
        carTarget.group.matrixAutoUpdate = true;
        carTarget.group.position.x = targetPlayer.position.x;
        carTarget.group.position.z = targetPlayer.position.z;
        const gY = Math.max(getSurfaceHeight(carTarget.group.position.x, carTarget.group.position.z), getWaterWaveHeight(carTarget.group.position.x, carTarget.group.position.z, 0));
        carTarget.group.position.y = gY;
        
        carTarget.yaw = targetPlayer.rotation.y;
        const normal = getNormalAt(carTarget.group.position.x, carTarget.group.position.z);
        const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), carTarget.yaw);
        const qAlign = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
        carTarget.group.quaternion.copy(qAlign).multiply(qYaw);
      }
    }

    function createChunk(cx, cz) {
      const group = new THREE.Group();
      const seed = getDeterministicRandom(cx, cz);
      const key = `${cx},${cz}`;
      
      group.userData = { cX: cx, cZ: cz, key: key, colliders: [], isCity: false };

      const terrainGeo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, TERRAIN_SEGMENTS, TERRAIN_SEGMENTS);
      terrainGeo.rotateX(-Math.PI / 2);
      const posAttribute = terrainGeo.attributes.position;
      const normAttribute = terrainGeo.attributes.normal;
      const worldX = cx * CHUNK_SIZE;
      const worldZ = cz * CHUNK_SIZE;

      let minY = Infinity, maxY = -Infinity;

      for (let i = 0; i < posAttribute.count; i++) {
        const absX = worldX + posAttribute.getX(i);
        const absZ = worldZ + posAttribute.getZ(i);
        const vy = pseudoNoise(absX, absZ);
        posAttribute.setY(i, vy);
        const norm = getNormalAt(absX, absZ);
        normAttribute.setXYZ(i, norm.x, norm.y, norm.z);
        if (vy < minY) minY = vy;
        if (vy > maxY) maxY = vy;
      }
      
      terrainGeo.computeBoundingBox(); terrainGeo.computeBoundingSphere();
      const terrainMesh = new THREE.Mesh(terrainGeo, SHARED_MATS.terrain);
      terrainMesh.receiveShadow = true; terrainMesh.castShadow = true;
      terrainMesh.frustumCulled = false; terrainMesh.customDepthMaterial = sharedDepthMaterial;
      terrainMesh.userData = { originalMaterial: SHARED_MATS.terrain };
      // OPTIMIZACIÓN RENDIMIENTO: Congelar terreno
      terrainMesh.matrixAutoUpdate = false; terrainMesh.updateMatrix();
      group.add(terrainMesh);

      if (seed > 0.992 && (maxY - minY) < 220 && minY > WATER_LEVEL + 15) {
        group.userData.isCity = true;
        
        const cityStyleSeed = getDeterministicRandom(cx, cz);
        let cityGrid = 15; 
        let heightMultiplier = 1.0;
        let skyscraperSpread = 2; 

        if (cityStyleSeed < 0.25) {
          cityGrid = 15; skyscraperSpread = 2; heightMultiplier = 1.0;
        } else if (cityStyleSeed < 0.50) {
          cityGrid = 25; skyscraperSpread = 5; heightMultiplier = 1.1;
        } else if (cityStyleSeed < 0.75) {
          cityGrid = 18; skyscraperSpread = 8; heightMultiplier = 1.7;
        } else {
          cityGrid = 16; skyscraperSpread = 2; heightMultiplier = 0.35;
        }

        const spacing = 100;
        const citySize = cityGrid * 2 * spacing;
        const citySegments = 8; 
        const cityBaseGeo = new THREE.PlaneGeometry(citySize, citySize, citySegments, citySegments);
        cityBaseGeo.rotateX(-Math.PI / 2);
        const cbPos = cityBaseGeo.attributes.position;
        for (let i = 0; i < cbPos.count; i++) {
           const absX = worldX + cbPos.getX(i);
           const absZ = worldZ + cbPos.getZ(i);
           cbPos.setY(i, pseudoNoise(absX, absZ) + 1.0); 
        }
        
        const cityBase = new THREE.Mesh(cityBaseGeo, SHARED_MATS.road);
        cityBase.receiveShadow = true;
        cityBase.frustumCulled = false;
        cityBase.userData = { originalMaterial: SHARED_MATS.road };
        // OPTIMIZACIÓN RENDIMIENTO: Congelar asfalto
        cityBase.matrixAutoUpdate = false; cityBase.updateMatrix();
        group.add(cityBase);

        const cityInstances = { skyscrapers: [], antennas: [], midBuildings: [], houses: [], roofs: [] };
        const cityCarInstances = { bodies: [], colors: [], cabins: [], wheels: [] };

        const _cMat = new THREE.Matrix4();
        const _cPos = new THREE.Vector3();
        const _cQuat = new THREE.Quaternion(); 
        const _cScale = new THREE.Vector3(1, 1, 1);

        for (let bx = -cityGrid; bx <= cityGrid; bx++) { 
          for (let bz = -cityGrid; bz <= cityGrid; bz++) {
            
            const bX = worldX + bx * spacing;
            const bZ = worldZ + bz * spacing;
            const bY = pseudoNoise(bX, bZ);
            
            if (bY <= WATER_LEVEL + 5) continue;

            const distFromCenter = Math.max(Math.abs(bx), Math.abs(bz));

            // OPTIMIZACIÓN RENDIMIENTO CIUDADES: Renderizado de coches en ciudad por GPU InstancedMesh
            if (Math.random() > 0.45) {
              const offsetX = (Math.random() > 0.5 ? 1 : -1) * (spacing / 2 - 6);
              const offsetZ = (Math.random() > 0.5 ? 1 : -1) * (spacing / 2 - 6);
              const rotY = Math.random() > 0.5 ? 0 : Math.PI / 2;
              const actualCarY = pseudoNoise(bX + offsetX, bZ + offsetZ) + 1.0; 
              
              group.userData.colliders.push({ x: bX + offsetX, z: bZ + offsetZ, r: 3.5, y: actualCarY, h: 2 });
              
              const carLocalX = (bX + offsetX) - worldX;
              const carLocalZ = (bZ + offsetZ) - worldZ;
              const randomColorHex = carColors[Math.floor(Math.random() * carColors.length)];

              const normal = getNormalAt(bX + offsetX, bZ + offsetZ);
              const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rotY);
              const qAlign = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
              const qCar = qAlign.clone().multiply(qYaw);

              const _carMat = new THREE.Matrix4();
              const _pVec = new THREE.Vector3();

              // Body matrix
              _pVec.set(0, 0.9, 0).applyQuaternion(qCar).add(new THREE.Vector3(carLocalX, actualCarY, carLocalZ));
              _carMat.compose(_pVec, qCar, _cScale);
              cityCarInstances.bodies.push(_carMat.clone());
              cityCarInstances.colors.push(new THREE.Color(randomColorHex));

              // Cabin matrix
              _pVec.set(0, 1.9, -0.3).applyQuaternion(qCar).add(new THREE.Vector3(carLocalX, actualCarY, carLocalZ));
              _carMat.compose(_pVec, qCar, _cScale);
              cityCarInstances.cabins.push(_carMat.clone());

              // Wheels matrices
              const wheelPositions = [[-1.6, 0.55, 1.8], [1.6, 0.55, 1.8], [-1.6, 0.55, -1.8], [1.6, 0.55, -1.8]];
              wheelPositions.forEach(p => {
                _pVec.set(p[0], p[1], p[2]).applyQuaternion(qCar).add(new THREE.Vector3(carLocalX, actualCarY, carLocalZ));
                _carMat.compose(_pVec, qCar, _cScale);
                cityCarInstances.wheels.push(_carMat.clone());
              });

              worldCars.push({
                group: null,
                x: bX + offsetX,
                y: actualCarY,
                z: bZ + offsetZ,
                rotY: rotY,
                speed: 0,
                steering: 0,
                chunkKey: key,
                yaw: rotY,
                isParkedInstanced: true,
                instanceIdx: cityCarInstances.bodies.length - 1
              });
            }

            if (Math.random() > 0.85) continue;

            let colRadius = 15;
            let bHeight = 0;
            const bury = 50; 

            if (distFromCenter === 0) {
              const h = (500 + getDeterministicRandom(bx+cx, bz+cz) * 300) * heightMultiplier;
              const totalH = h + bury;
              _cPos.set(bx * spacing, bY + totalH / 2 - bury, bz * spacing);
              _cScale.set(1, totalH, 1);
              _cMat.compose(_cPos, _cQuat, _cScale);
              cityInstances.skyscrapers.push(_cMat.clone());
              
              _cPos.set(bx * spacing, bY + h + 30, bz * spacing);
              _cScale.set(1, 1, 1);
              _cMat.compose(_cPos, _cQuat, _cScale);
              cityInstances.antennas.push(_cMat.clone());
              
              colRadius = 30; bHeight = h + 30;

            } else if (distFromCenter <= skyscraperSpread) {
              const h = (200 + getDeterministicRandom(bx+cx, bz+cz) * 200) * heightMultiplier;
              const totalH = h + bury;
              _cPos.set(bx * spacing, bY + totalH / 2 - bury, bz * spacing);
              _cScale.set(1, totalH, 1);
              _cMat.compose(_cPos, _cQuat, _cScale);
              cityInstances.skyscrapers.push(_cMat.clone());
              
              colRadius = 25; bHeight = h;

            } else if (distFromCenter <= skyscraperSpread + 2) {
              const h = (60 + getDeterministicRandom(bx+cx, bz+cz) * 60) * Math.max(0.6, heightMultiplier);
              const totalH = h + bury;
              _cPos.set(bx * spacing, bY + totalH / 2 - bury, bz * spacing);
              _cScale.set(1, totalH, 1);
              _cMat.compose(_cPos, _cQuat, _cScale);
              cityInstances.midBuildings.push(_cMat.clone());
              
              colRadius = 18; bHeight = h;

            } else {
              const hBase = 20;
              _cPos.set(bx * spacing, bY - 10, bz * spacing); 
              _cScale.set(1, 1, 1);
              _cMat.compose(_cPos, _cQuat, _cScale);
              cityInstances.houses.push(_cMat.clone());
              
              _cPos.set(bx * spacing, bY + hBase + 5, bz * spacing);
              _cMat.compose(_cPos, _cQuat, _cScale);
              cityInstances.roofs.push(_cMat.clone());
              
              colRadius = 15; bHeight = hBase + 10;
            }
            
            group.userData.colliders.push({ x: bX, z: bZ, r: colRadius, y: bY, h: bHeight });
          }
        }

        const addInstancedBuildings = (arr, geo, mat, isDetail = false) => {
          if (arr.length === 0) return;
          const mesh = new THREE.InstancedMesh(geo, mat, arr.length);
          arr.forEach((m, i) => { mesh.setMatrixAt(i, m); });
          mesh.instanceMatrix.needsUpdate = true;
          mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
          mesh.customDepthMaterial = sharedDepthMaterial; 
          mesh.userData = { originalMaterial: mat, isDetail: isDetail };
          mesh.matrixAutoUpdate = false; mesh.updateMatrix();
          group.add(mesh);
        };

        addInstancedBuildings(cityInstances.skyscrapers, SHARED_GEOS.skyscraper, SHARED_MATS.building, false);
        addInstancedBuildings(cityInstances.antennas, SHARED_GEOS.antenna, SHARED_MATS.tower, true);
        addInstancedBuildings(cityInstances.midBuildings, SHARED_GEOS.midBuilding, SHARED_MATS.building, true);
        addInstancedBuildings(cityInstances.houses, SHARED_GEOS.houseBase, SHARED_MATS.building, true);
        addInstancedBuildings(cityInstances.roofs, SHARED_GEOS.houseRoof, SHARED_MATS.roof, true);

        // Añadir InstancedMeshes para coches de la ciudad
        if (cityCarInstances.bodies.length > 0) {
          const bodyMesh = new THREE.InstancedMesh(SHARED_GEOS.carBody, SHARED_MATS.carBodyInst, cityCarInstances.bodies.length);
          const cabinMesh = new THREE.InstancedMesh(SHARED_GEOS.carCabin, SHARED_MATS.carCabinInst, cityCarInstances.cabins.length);
          const wheelMesh = new THREE.InstancedMesh(SHARED_GEOS.carWheel, SHARED_MATS.carWheelInst, cityCarInstances.wheels.length);

          cityCarInstances.bodies.forEach((m, i) => {
            bodyMesh.setMatrixAt(i, m);
            bodyMesh.setColorAt(i, cityCarInstances.colors[i]);
          });
          bodyMesh.instanceMatrix.needsUpdate = true;
          if (bodyMesh.instanceColor) bodyMesh.instanceColor.needsUpdate = true;

          cityCarInstances.cabins.forEach((m, i) => cabinMesh.setMatrixAt(i, m));
          cabinMesh.instanceMatrix.needsUpdate = true;

          cityCarInstances.wheels.forEach((m, i) => wheelMesh.setMatrixAt(i, m));
          wheelMesh.instanceMatrix.needsUpdate = true;

          [bodyMesh, cabinMesh, wheelMesh].forEach(m => {
            m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;
            m.userData = { isDetail: true, originalMaterial: m.material };
            m.matrixAutoUpdate = false; m.updateMatrix();
            group.add(m);
          });
        }

        // GENERADOR DE AEROPUERTO DENTRO DE CADA CIUDAD
        const rX = cityGrid * spacing + 150; 
        const rZ = 0;
        const worldRx = worldX + rX;
        const worldRz = worldZ + rZ;
        const rY = pseudoNoise(worldRx, worldRz) + 2;

        const runway = new THREE.Mesh(SHARED_GEOS.runway, SHARED_MATS.runway);
        runway.position.set(rX, rY, rZ); runway.frustumCulled = false;
        runway.userData = { originalMaterial: SHARED_MATS.runway };
        runway.matrixAutoUpdate = false; runway.updateMatrix();
        group.add(runway);

        const tower = new THREE.Mesh(SHARED_GEOS.tower, SHARED_MATS.tower);
        tower.position.set(rX + 45, rY + 24, rZ); tower.castShadow = true; tower.frustumCulled = false;
        tower.customDepthMaterial = sharedDepthMaterial; tower.userData = { originalMaterial: SHARED_MATS.tower };
        tower.matrixAutoUpdate = false; tower.updateMatrix();
        group.add(tower);
        
        group.userData.colliders.push({ x: worldRx + 45, z: worldRz, r: 7.5, y: rY, h: 50 });
        activeAirports.push({ key: key, x: worldRx, z: worldRz, rY: rY, hasUpgraded: false });
        spawnCar(worldRx + 25, worldRz + 25, key); 

        // AÑADIR AVIONES APARCADOS EN LOS AEROPUERTOS ARREGLADO Y PILOTABLES
        const numPlanes = 2 + Math.floor(getDeterministicRandom(cx, cz) * 3); 
        for(let p = 0; p < numPlanes; p++) {
          const pX = rX - 45; 
          const pZ = rZ - 80 + (p * 55); 
          const planeMesh = createStaticPlaneMesh();
          
          const pWorldX = worldX + pX;
          const pWorldZ = worldZ + pZ;
          const planeY = pseudoNoise(pWorldX, pWorldZ) + 1.5; 
          
          planeMesh.position.set(pWorldX, planeY, pWorldZ);
          planeMesh.rotation.y = Math.PI / 2 + (getDeterministicRandom(cx + p, cz + p) * 0.2 - 0.1);
          
          planeMesh.userData = { isDetail: true }; 
          planeMesh.matrixAutoUpdate = false; planeMesh.updateMatrix();
          
          scene.add(planeMesh);
          worldPlanes.push({ group: planeMesh, prop: planeMesh.children[3], chunkKey: key });
          group.userData.colliders.push({ x: worldRx - 45, z: worldRz - 80 + (p * 55), r: 8, y: planeY, h: 5 });
        }
      } 
      
      const trees = [], rocks = [], snows = [];
      for (let i = 0; i < 4; i++) {
        const tx = (getDeterministicRandom(cx + i, cz - i) - 0.5) * CHUNK_SIZE;
        const tz = (getDeterministicRandom(cx - i, cz + i) - 0.5) * CHUNK_SIZE;
        const ty = pseudoNoise(tx + worldX, tz + worldZ);

        if (ty > WATER_LEVEL + 5 && ty < 1200) { 
          if (getDeterministicRandom(tx, tz) > 0.3) trees.push({ x: tx, y: ty + 9, z: tz });
          else rocks.push({ x: tx, y: ty + 4, z: tz });
        } else if (ty >= 2000) { snows.push({ x: tx, y: ty + 10, z: tz }); }
      }

      const addInstanced = (arr, geo, mat) => {
        if (arr.length === 0) return;
        const mesh = new THREE.InstancedMesh(geo, mat, arr.length);
        arr.forEach((item, i) => { dummyMatrix.setPosition(item.x, item.y, item.z); mesh.setMatrixAt(i, dummyMatrix); });
        mesh.instanceMatrix.needsUpdate = true;
        mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
        mesh.customDepthMaterial = sharedDepthMaterial; mesh.userData = { originalMaterial: mat };
        mesh.matrixAutoUpdate = false; mesh.updateMatrix();
        group.add(mesh);
      };
      
      addInstanced(trees, SHARED_GEOS.tree, SHARED_MATS.tree);
      addInstanced(rocks, SHARED_GEOS.rock, SHARED_MATS.rock);
      addInstanced(snows, SHARED_GEOS.snow, SHARED_MATS.snow);

      if (seed > 0.985) {
        const cloudX = worldX + (getDeterministicRandom(cz, cx) - 0.5) * CHUNK_SIZE;
        const cloudZ = worldZ + (getDeterministicRandom(cx, cz) - 0.5) * CHUNK_SIZE;
        if (!activeCloudPositions.some(p => (p.x - cloudX) ** 2 + (p.z - cloudZ) ** 2 < 3200 * 3200)) {
          const cloud = new THREE.Mesh(SHARED_GEOS.cloud, SHARED_MATS.cloud);
          const cloudY = 5500 + getDeterministicRandom(cx + 1, cz + 1) * 2500;
          cloud.position.set(cloudX - worldX, cloudY, cloudZ - worldZ);
          cloud.frustumCulled = false; cloud.userData = { isCloud: true, originalMaterial: SHARED_MATS.cloud };
          cloud.matrixAutoUpdate = false; cloud.updateMatrix();
          group.add(cloud);
          activeCloudPositions.push({ x: cloudX, z: cloudZ, key: key });
          if (cloudY + 1800 > maxY) maxY = cloudY + 1800;
        }
      }

      group.position.set(worldX, 0, worldZ);
      const centerY = (minY + maxY) / 2;
      const heightHalf = Math.max((maxY - minY) / 2, CHUNK_SIZE / 2);
      const halfDiagonal = Math.sqrt((CHUNK_SIZE / 2) ** 2 + (CHUNK_SIZE / 2) ** 2 + heightHalf ** 2) + 2000;
      group.boundingSphere = new THREE.Sphere(new THREE.Vector3(worldX, centerY, worldZ), halfDiagonal);

      scene.add(group);
      return group;
    }

    function preloadWorld() {
      const activeRef = currentMode === 'PLANE' ? activePlane.group : (currentMode === 'CAR' && activeCar ? activeCar.group : playerGroup);
      const pX = Math.floor(activeRef.position.x / CHUNK_SIZE);
      const pZ = Math.floor(activeRef.position.z / CHUNK_SIZE);
      for (let x = -CLOUD_RENDER_DISTANCE; x <= CLOUD_RENDER_DISTANCE; x++) {
        for (let z = -CLOUD_RENDER_DISTANCE; z <= CLOUD_RENDER_DISTANCE; z++) {
          const key = `${pX + x},${pZ + z}`;
          if (!chunks.has(key)) {
            const chunkGroup = createChunk(pX + x, pZ + z);
            if (chunkGroup) chunks.set(key, chunkGroup);
          }
        }
      }
    }

    const initialCar = spawnCar(0, 0, null);

    function updateTerrain() {
      const activeRef = currentMode === 'PLANE' ? activePlane.group : (currentMode === 'CAR' && activeCar ? activeCar.group : playerGroup);
      const pX = Math.floor(activeRef.position.x / CHUNK_SIZE);
      const pZ = Math.floor(activeRef.position.z / CHUNK_SIZE);
      let createdThisFrame = 0; const MAX_CREATIONS_PER_FRAME = 2;

      camera.updateMatrixWorld(true); cameraMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      playerFrustum.setFromProjectionMatrix(cameraMatrix);
      sunMatrix.multiplyMatrices(dirLight.shadow.camera.projectionMatrix, dirLight.shadow.camera.matrixWorldInverse);
      sunFrustum.setFromProjectionMatrix(sunMatrix);

      for (let r = 0; r <= CLOUD_RENDER_DISTANCE; r++) {
        for (let x = -r; x <= r; x++) {
          for (let z = -r; z <= r; z++) {
            if (Math.abs(x) !== r && Math.abs(z) !== r) continue;
            const key = `${pX + x},${pZ + z}`;
            if (!chunks.has(key)) {
              const chunkGroup = createChunk(pX + x, pZ + z);
              if (chunkGroup) { chunks.set(key, chunkGroup); createdThisFrame++; }
              if (createdThisFrame >= MAX_CREATIONS_PER_FRAME) break;
            }
          }
          if (createdThisFrame >= MAX_CREATIONS_PER_FRAME) break;
        }
        if (createdThisFrame >= MAX_CREATIONS_PER_FRAME) break;
      }

      for (const chunkGroup of chunks.values()) {
        const cX = chunkGroup.userData.cX, cZ = chunkGroup.userData.cZ, key = chunkGroup.userData.key;
        const distX = Math.abs(cX - pX), distZ = Math.abs(cZ - pZ);

        if (distX > CLOUD_RENDER_DISTANCE + 2 || distZ > CLOUD_RENDER_DISTANCE + 2) {
          scene.remove(chunkGroup);
          const children = chunkGroup.children;
          for (let i = 0, len = children.length; i < len; i++) {
            if (children[i].geometry) children[i].geometry.dispose();
          }
          chunks.delete(key);
          const cloudIdx = activeCloudPositions.findIndex(p => p.key === key); if (cloudIdx !== -1) activeCloudPositions.splice(cloudIdx, 1);
          const airportIdx = activeAirports.findIndex(a => a.key === key); if (airportIdx !== -1) activeAirports.splice(airportIdx, 1);
          
          for (let i = worldCars.length - 1; i >= 0; i--) {
            if (worldCars[i].chunkKey === key) {
              if (activeCar === worldCars[i]) {
                worldCars[i].chunkKey = null; 
              } else {
                if (worldCars[i].group) scene.remove(worldCars[i].group);
                worldCars.splice(i, 1);
              }
            }
          }

          for (let i = worldPlanes.length - 1; i >= 0; i--) {
            if (worldPlanes[i].chunkKey === key) {
              if (activePlane === worldPlanes[i]) {
                worldPlanes[i].chunkKey = null; 
              } else {
                scene.remove(worldPlanes[i].group);
                worldPlanes.splice(i, 1);
              }
            }
          }
        } else {
          const isTerrainInDistance = distX <= RENDER_DISTANCE && distZ <= RENDER_DISTANCE;
          const sphere = chunkGroup.boundingSphere;

          if (isTerrainInDistance) {
            if (playerFrustum.intersectsSphere(sphere)) {
              chunkGroup.visible = true;
              const isFar = (distX > 3 || distZ > 3);
              const children = chunkGroup.children;
              for (let i = 0, len = children.length; i < len; i++) {
                const child = children[i];
                if (child.userData.isDetail && isFar) {
                  child.visible = false;
                } else {
                  child.visible = true;
                  if (child.userData.originalMaterial) child.material = child.userData.originalMaterial;
                }
              }
            } else if (sunFrustum.intersectsSphere(sphere)) {
              chunkGroup.visible = true;
              const isFar = (distX > 3 || distZ > 3);
              const children = chunkGroup.children;
              for (let i = 0, len = children.length; i < len; i++) {
                const child = children[i];
                if (child.userData.isCloud || (child.userData.isDetail && isFar)) {
                   child.visible = false;
                } else { 
                   child.visible = true; 
                   if (!child.isGroup) {
                       child.material = invisibleMat; 
                   }
                }
              }
            } else { chunkGroup.visible = false; }
          } else { chunkGroup.visible = false; }
        }
      }

      for (let i = 0; i < worldCars.length; i++) {
        if (worldCars[i].chunkKey && worldCars[i] !== activeCar && worldCars[i].group) {
          const [cx, cz] = worldCars[i].chunkKey.split(',').map(Number);
          const dx = Math.abs(cx - pX);
          const dz = Math.abs(cz - pZ);
          worldCars[i].group.visible = (dx <= 3 && dz <= 3);
        }
      }

      for (let i = 0; i < worldPlanes.length; i++) {
        if (worldPlanes[i].chunkKey && worldPlanes[i] !== activePlane) {
          const [cx, cz] = worldPlanes[i].chunkKey.split(',').map(Number);
          const dx = Math.abs(cx - pX);
          const dz = Math.abs(cz - pZ);
          worldPlanes[i].group.visible = (dx <= 3 && dz <= 3);
        }
      }
    }

    function checkCollision(pos, radius) {
      let pX = Math.floor(pos.x / CHUNK_SIZE);
      let pZ = Math.floor(pos.z / CHUNK_SIZE);
      
      for(let x = -1; x <= 1; x++) {
        for(let z = -1; z <= 1; z++) {
          let chunk = chunks.get(`${pX+x},${pZ+z}`);
          if (chunk && chunk.userData.colliders) {
            for (let col of chunk.userData.colliders) {
              let dx = pos.x - col.x; let dz = pos.z - col.z;
              let distSq = dx*dx + dz*dz;
              if (distSq < 0.2) continue;
              let rSum = radius + col.r;
              if (distSq < rSum*rSum) {
                if (col.y !== undefined && col.h !== undefined) {
                  let objBottom = pos.y - radius;
                  let objTop = pos.y + radius;
                  let colBottom = col.y;
                  let colTop = col.y + col.h;
                  
                  if (objBottom <= colTop && objTop >= colBottom) {
                    return { hit: true, dx: dx, dz: dz, distSq: distSq, rSum: rSum };
                  }
                } else {
                  return { hit: true, dx: dx, dz: dz, distSq: distSq, rSum: rSum };
                }
              }
            }
          }
        }
      }
      return { hit: false };
    }

    let joyTouchId = null, throttleTouchId = null, joystickInput = { x: 0, y: 0 }, controlsSwapped = false;
    let uiVisible = true;
    let currentMode = 'PLANE'; let activeCar = null;
    const baseGears = { 'R': -15, 'N': 0, '1': 20, '2': 40, '3': 60, '4': 90, '5': 120, '6': 210, '7': 499.5 };
    let speedMultiplier = 1.0; let upgradeCount = 0; 
    const physics = { speed: 0, gearRatio: 0, currentGear: 'N', gears: { ...baseGears } };

    function upgradeGearSpeeds() {
      if (upgradeCount >= 6) return; 
      upgradeCount++; speedMultiplier += 0.25; 
      for (const g in baseGears) { if (g !== 'R' && g !== 'N') physics.gears[g] = baseGears[g] * speedMultiplier; }
      physics.gearRatio = physics.gears[physics.currentGear];
      if (upgradeCount === 6) {
        const handle = document.getElementById('throttle-handle');
        handle.style.background = '#ffd700'; handle.style.boxShadow = '0 0 15px #ffd700'; handle.style.color = '#000';
      }
    }
    
    planeGroup.position.set(0, 3500, 0);

    const joyBase = document.getElementById('joystick-base'), joyStick = document.getElementById('joystick-stick');
    const throttleContainer = document.getElementById('throttle-container'), throttleHandle = document.getElementById('throttle-handle');

    document.getElementById('action-btn').addEventListener('click', () => {
      if (currentMode === 'PLANE') {
        if (Math.abs(physics.speed) < 60) {
          currentMode = 'FOOT';
          playerGroup.position.copy(activePlane.group.position);
          playerGroup.position.y = getSurfaceHeight(playerGroup.position.x, playerGroup.position.z);
          playerGroup.visible = true; physics.speed = 0; setGear('N');
        }
      } else if (currentMode === 'CAR') {
        currentMode = 'FOOT';
        playerGroup.position.copy(activeCar.group.position).add(new THREE.Vector3(4, 0, 0));
        playerGroup.visible = true; activeCar.speed = 0; setGear('N'); activeCar = null;
      } else if (currentMode === 'FOOT') {
        let nearestPlane = null; let minDPlane = 15;
        worldPlanes.forEach(p => {
          const d = playerGroup.position.distanceTo(p.group.position);
          if (d < minDPlane) { minDPlane = d; nearestPlane = p; }
        });
        
        if (nearestPlane) {
          activePlane = nearestPlane;
          activePlane.group.matrixAutoUpdate = true;
          currentMode = 'PLANE';
          playerGroup.visible = false;
          setGear('N');
          return;
        }

        let nearestCar = null; let minD = 15;
        worldCars.forEach(c => {
          const carPos = c.group ? c.group.position : new THREE.Vector3(c.x, c.y, c.z);
          const d = playerGroup.position.distanceTo(carPos);
          if (d < minD) { minD = d; nearestCar = c; }
        });
        
        if (nearestCar) {
          putCarUnderPlayer(playerGroup, nearestCar);
          currentMode = 'CAR'; activeCar = nearestCar; playerGroup.visible = false; setGear('N');
        }
      }
    });

    document.getElementById('toggle-ui-btn').addEventListener('click', (e) => {
      uiVisible = !uiVisible;
      const ctrls = document.getElementById('controls-container');
      ctrls.style.opacity = uiVisible ? '1' : '0'; ctrls.style.pointerEvents = uiVisible ? 'auto' : 'none';
      e.target.innerText = uiVisible ? 'Ocultar UI' : 'Mostrar UI';
    });

    document.getElementById('swap-btn').addEventListener('click', () => {
      controlsSwapped = !controlsSwapped;
      const lZ = document.getElementById('left-zone'), rZ = document.getElementById('right-zone');
      if (controlsSwapped) { lZ.appendChild(throttleContainer); rZ.appendChild(joyBase); }
      else { lZ.appendChild(joyBase); rZ.appendChild(throttleContainer); }
    });

    joyBase.addEventListener('touchstart', e => { joyTouchId = e.changedTouches[0].identifier; updateJoystick(e.changedTouches[0]); }, { passive: true });
    window.addEventListener('touchmove', e => {
      for (let i = 0, len = e.changedTouches.length; i < len; i++) {
        let t = e.changedTouches[i];
        if (t.identifier === joyTouchId) updateJoystick(t);
        if (t.identifier === throttleTouchId) updateThrottleByTouch(t);
      }
    }, { passive: true });
    
    window.addEventListener('touchend', e => {
      for (let i = 0, len = e.changedTouches.length; i < len; i++) {
        let t = e.changedTouches[i];
        if (t.identifier === joyTouchId) { joyTouchId = null; joystickInput = { x: 0, y: 0 }; joyStick.style.transform = `translate(0px, 0px)`; }
        if (t.identifier === throttleTouchId) throttleTouchId = null;
      }
    });

    function updateJoystick(touch) {
      const rect = joyBase.getBoundingClientRect();
      let dx = touch.clientX - (rect.left + rect.width / 2), dy = touch.clientY - (rect.top + rect.height / 2);
      const dist = Math.min(Math.hypot(dx, dy), 50), angle = Math.atan2(dy, dx);
      dx = Math.cos(angle) * dist; dy = Math.sin(angle) * dist;
      joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
      joystickInput.x = dx / 50; joystickInput.y = dy / 50;
    }

    throttleContainer.addEventListener('touchstart', e => { throttleTouchId = e.changedTouches[0].identifier; updateThrottleByTouch(e.changedTouches[0]); }, { passive: true });

    function setGear(gear) {
      const gearKeys = ['R', 'N', '1', '2', '3', '4', '5', '6', '7'];
      physics.currentGear = gear; throttleHandle.innerText = gear;
      let relY = 1 - (gearKeys.indexOf(gear) / 8);
      throttleHandle.style.bottom = `${(relY * -1 + 1) * 80 + 5}%`;
      physics.gearRatio = physics.gears[gear]; document.getElementById('hud-gear').innerText = gear;
    }

    function updateThrottleByTouch(touch) {
      const rect = throttleContainer.getBoundingClientRect();
      let relY = Math.max(0, Math.min(1, (touch.clientY - rect.top) / rect.height));
      const gearKeys = ['R', 'N', '1', '2', '3', '4', '5', '6', '7'];
      setGear(gearKeys[Math.min(8, Math.max(0, 8 - Math.floor(relY * 9)))]);
    }

    function changeThrottle(direction) {
      const gearKeys = ['R', 'N', '1', '2', '3', '4', '5', '6', '7'];
      let currentIndex = gearKeys.indexOf(physics.currentGear);
      setGear(gearKeys[Math.max(0, Math.min(gearKeys.length - 1, currentIndex + direction))]);
    }

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, W: false, s: false, S: false, a: false, A: false, d: false, D: false };
    const gpBtnState = { RB: false, LB: false };

    window.addEventListener('keydown', e => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
      if (e.key === '0') setGear('N'); if (e.key === 'q' || e.key === 'Q') setGear('R');
      if (['1','2','3','4','5','6','7'].includes(e.key)) setGear(e.key);
      if (e.key === 'e' || e.key === 'E') document.getElementById('action-btn').click();
    });
    window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    const clock = new THREE.Clock();
    const _forwardDir = new THREE.Vector3(), _camOffset = new THREE.Vector3(), _camTarget = new THREE.Vector3(), _lookAhead = new THREE.Vector3();
    const _groundEuler = new THREE.Euler(0, 0, 0, 'YXZ');
    let _lastLightX = -999999, _lastLightZ = -999999;

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      if (localWaterMaterial.userData.shader) localWaterMaterial.userData.shader.uniforms.uTime.value = time;
      if (distantWaterMaterial.userData.shader) distantWaterMaterial.userData.shader.uniforms.uTime.value = time;

      let pitchCmd = 0; let rollCmd = 0; let yawCmd = 0;   
      if (keys.w || keys.W || keys.ArrowUp) pitchCmd = -1;
      if (keys.s || keys.S || keys.ArrowDown) pitchCmd = 1;
      if (keys.a || keys.A) rollCmd = -1;
      if (keys.d || keys.D) rollCmd = 1;
      if (keys.ArrowLeft) yawCmd = -1;
      if (keys.ArrowRight) yawCmd = 1;
      if (joyTouchId !== null) { rollCmd = joystickInput.x; pitchCmd = joystickInput.y; }

      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = gamepads[0];
      if (gp) {
        const rawAxisX = Math.abs(gp.axes[0]) > 0.1 ? gp.axes[0] : 0;
        const rawAxisY = Math.abs(gp.axes[1]) > 0.1 ? gp.axes[1] : 0;
        if (rawAxisX !== 0 || rawAxisY !== 0) { rollCmd = rawAxisX; pitchCmd = rawAxisY; }
        if (gp.buttons[5] && gp.buttons[5].pressed && !gpBtnState.RB) changeThrottle(1);
        if (gp.buttons[4] && gp.buttons[4].pressed && !gpBtnState.LB) changeThrottle(-1);
        gpBtnState.RB = gp.buttons[5] ? gp.buttons[5].pressed : false;
        gpBtnState.LB = gp.buttons[4] ? gp.buttons[4].pressed : false;
      }

      document.getElementById('hud-mode').innerText = currentMode;

      if (currentMode === 'PLANE') {
        _forwardDir.set(0, 0, 1).applyQuaternion(activePlane.group.quaternion);
        
        if (physics.currentGear === 'N') {
          physics.speed -= physics.speed * 4.0 * 0.05 * delta;
          physics.speed -= _forwardDir.y * 45 * delta;
        } else { physics.speed += (physics.gearRatio - physics.speed) * Math.min(delta * 1.5, 1.0); }

        const absSpeed = Math.abs(physics.speed), controlEffect = Math.min(absSpeed / 35, 0.85);

        activePlane.group.rotateX(-pitchCmd * controlEffect * delta * 1.2);
        activePlane.group.rotateZ(rollCmd * controlEffect * delta * 4.5);
        activePlane.group.rotateY((yawCmd * 1.5 + rollCmd * 0.6) * controlEffect * delta * (physics.speed >= 0 ? 1 : -1)); 
        activePlane.group.translateZ(physics.speed * delta);

        const currentPos = activePlane.group.position;
        
        let hitTest = checkCollision(currentPos, 4);
        if (hitTest.hit) {
           physics.speed = 0; 
           let dist = Math.sqrt(hitTest.distSq) || 0.001;
           let push = hitTest.rSum - dist;
           currentPos.x += (hitTest.dx / dist) * push;
           currentPos.z += (hitTest.dz / dist) * push;
        }
        
        const terrainHeight = Math.max(getSurfaceHeight(currentPos.x, currentPos.z), getWaterWaveHeight(currentPos.x, currentPos.z, time));
        let minAltitude = terrainHeight + 1.2;

        for (let i = 0, len = activeAirports.length; i < len; i++) {
          const ap = activeAirports[i];
          const dxR = currentPos.x - ap.x, dzR = currentPos.z - ap.z;
          if (Math.abs(dxR) <= 30 && Math.abs(dzR) <= 250) {
            const runwayAlt = ap.rY + 1.2;
            if (runwayAlt > minAltitude) minAltitude = runwayAlt;
            if (currentPos.y <= ap.rY + 1.6 && !ap.hasUpgraded) { upgradeGearSpeeds(); ap.hasUpgraded = true; }
          } else if (Math.hypot(dxR, dzR) > 350) ap.hasUpgraded = false;
        }

        if (absSpeed < 20 && currentPos.y > minAltitude) activePlane.group.position.y -= (1 - absSpeed / 20) * 9.8 * delta;

        if (currentPos.y <= minAltitude) {
          currentPos.y = minAltitude;
          _groundEuler.setFromQuaternion(activePlane.group.quaternion, 'YXZ'); _groundEuler.z *= 0.8;
          if (_groundEuler.x < 0) _groundEuler.x *= 0.8;
          activePlane.group.quaternion.setFromEuler(_groundEuler);
        }

        if (activePlane.prop) activePlane.prop.rotation.z += (physics.speed !== 0 ? physics.speed : 1) * delta * (physics.currentGear === 'N' ? 0.2 : 0.5);

        _camTarget.copy(currentPos).add(_camOffset.set(0, 5, -18).applyQuaternion(activePlane.group.quaternion));
        camera.position.lerp(_camTarget, 0.1);
        camera.lookAt(_camTarget.copy(currentPos).add(_lookAhead.copy(_baseLookAhead).applyQuaternion(activePlane.group.quaternion)));

        document.getElementById('hud-alt').innerText = Math.max(0, Math.round(currentPos.y - WATER_LEVEL - 1.2));
        document.getElementById('hud-spd').innerText = Math.round(physics.speed * 2);

      } else {
        const cPos = activePlane.group.position;
        const terrainHeight = Math.max(getSurfaceHeight(cPos.x, cPos.z), getWaterWaveHeight(cPos.x, cPos.z, time));
        let minAltitude = terrainHeight + 1.2;

        for (let i = 0, len = activeAirports.length; i < len; i++) {
          const ap = activeAirports[i];
          if (Math.abs(cPos.x - ap.x) <= 30 && Math.abs(cPos.z - ap.z) <= 250) {
            if (ap.rY + 1.2 > minAltitude) minAltitude = ap.rY + 1.2;
          }
        }

        if (cPos.y > minAltitude) {
          cPos.y -= 50 * delta; 
          if (cPos.y < minAltitude) cPos.y = minAltitude;
        }

        if (cPos.y <= minAltitude) {
          cPos.y = minAltitude;
          _groundEuler.setFromQuaternion(activePlane.group.quaternion, 'YXZ'); 
          _groundEuler.z *= 0.8;
          if (_groundEuler.x < 0) _groundEuler.x *= 0.8;
          activePlane.group.quaternion.setFromEuler(_groundEuler);
        }
      }

      if (currentMode === 'CAR' && activeCar) {
        if (physics.currentGear === 'N') { activeCar.speed -= activeCar.speed * 2.5 * delta; } 
        else {
          let targetSpd = (physics.gearRatio / 499.5) * 120;
          activeCar.speed += (targetSpd - activeCar.speed) * Math.min(delta * 2.0, 1.0);
        }

        activeCar.yaw += -rollCmd * delta * 2.0;
        
        const normal = getNormalAt(activeCar.group.position.x, activeCar.group.position.z);
        const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), activeCar.yaw);
        const qAlign = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
        activeCar.group.quaternion.copy(qAlign).multiply(qYaw);

        activeCar.group.translateZ(activeCar.speed * delta);

        const carPos = activeCar.group.position;
        
        let hitTest = checkCollision(carPos, 3.5);
        if (hitTest.hit) {
           activeCar.speed = 0; 
           let dist = Math.sqrt(hitTest.distSq) || 0.001;
           let push = hitTest.rSum - dist;
           carPos.x += (hitTest.dx / dist) * push;
           carPos.z += (hitTest.dz / dist) * push;
        }

        const groundH = Math.max(getSurfaceHeight(carPos.x, carPos.z), getWaterWaveHeight(carPos.x, carPos.z, time));
        carPos.y = groundH;

        // CÁMARA DEL COCHE MÁS ELEVADA CON MAYOR FOV VERTICAL
        _camTarget.copy(carPos).add(_camOffset.set(0, 12, -18).applyQuaternion(activeCar.group.quaternion));
        camera.position.lerp(_camTarget, 0.1);
        camera.lookAt(_camTarget.copy(carPos).add(_lookAhead.set(0, 3, 5).applyQuaternion(activeCar.group.quaternion)));

        document.getElementById('hud-alt').innerText = Math.max(0, Math.round(carPos.y - WATER_LEVEL));
        document.getElementById('hud-spd').innerText = Math.round(activeCar.speed * 2.5);

      } else if (currentMode === 'FOOT') {
        const walkSpeed = 15;
        playerGroup.rotateY(-rollCmd * delta * 3.0);
        playerGroup.translateZ(-pitchCmd * walkSpeed * delta);

        const pPos = playerGroup.position;
        
        let hitTest = checkCollision(pPos, 1);
        if (hitTest.hit) {
           let dist = Math.sqrt(hitTest.distSq) || 0.001;
           let push = hitTest.rSum - dist;
           pPos.x += (hitTest.dx / dist) * push;
           pPos.z += (hitTest.dz / dist) * push;
        }

        const gH = Math.max(getSurfaceHeight(pPos.x, pPos.z), getWaterWaveHeight(pPos.x, pPos.z, time));
        pPos.y = gH;

        _camTarget.copy(pPos).add(_camOffset.set(0, 2.5, -6).applyQuaternion(playerGroup.quaternion));
        camera.position.lerp(_camTarget, 0.1);
        camera.lookAt(_camTarget.copy(pPos).add(_lookAhead.set(0, 1, 3).applyQuaternion(playerGroup.quaternion)));

        document.getElementById('hud-alt').innerText = Math.max(0, Math.round(pPos.y - WATER_LEVEL));
        document.getElementById('hud-spd').innerText = Math.round(Math.abs(pitchCmd) * walkSpeed);
      }

      const activeRef = currentMode === 'PLANE' ? activePlane.group : (currentMode === 'CAR' && activeCar ? activeCar.group : playerGroup);
      const snapShadow = 10;
      const newLightX = Math.floor(activeRef.position.x / snapShadow) * snapShadow + 20000;
      const newLightZ = Math.floor(activeRef.position.z / snapShadow) * snapShadow + 20000;

      if (newLightX !== _lastLightX || newLightZ !== _lastLightZ) {
        _lastLightX = newLightX; _lastLightZ = newLightZ;
        dirLight.position.set(newLightX, 40000, newLightZ);
        dirLight.target.position.set(newLightX - 20000, 0, newLightZ - 20000); dirLight.target.updateMatrixWorld(true);
        dirLight.shadow.camera.position.copy(dirLight.position); dirLight.shadow.camera.lookAt(dirLight.target.position);
        dirLight.shadow.camera.updateMatrixWorld(true); dirLight.shadow.camera.updateProjectionMatrix();
        sunGroup.position.copy(dirLight.position);
      }

      const snapSize = 20000 / 256;
      waterGroup.position.x = Math.floor(activeRef.position.x / snapSize) * snapSize;
      waterGroup.position.z = Math.floor(activeRef.position.z / snapSize) * snapSize;

      updateTerrain(); renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

    preloadWorld(); animate();
  </script>
